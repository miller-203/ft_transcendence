services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnhub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-learnhub}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-learnhub_user}:${POSTGRES_PASSWORD:-learnhub_dev_password}@postgres:5432/${POSTGRES_DB:-learnhub}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
